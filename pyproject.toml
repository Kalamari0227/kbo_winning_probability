[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kt-championship-engine"
version = "0.1.0"
description = "Probabilistic 2026 KBO KT Wiz championship race engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "lxml>=5.0,<7",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "httpx2[brotli,http2,zstd]>=2.13.1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
kt-championship = "kt_championship_engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kt_championship_engine = ["web/*", "web/teams/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
